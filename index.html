<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hatsune Miku: Colourful Stagle!</title>

    <link rel="stylesheet" href="style.css">

    <!-- This site uses Choices.js for music search -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
</head>

<body>
    <div id="content">
        <header class="layoutFlexItem">
            <h1 id="title">Colorful Stagle!</h1>
        </header>
        <div class="layoutFlexItem" id="songContent">
            <p id="loadingMusic" class="loadingAnimated">Loading song. Please wait...</p>
            <audio controls id="audio" hidden></audio>
            <div id="hintRow">
                <p id="status"></p>
                <button id="viewArtworkButton" class="hidden" onclick="ViewArtwork()">View Artwork</button>
            </div>
        </div>

        <div class="layoutFlexItem" id="middleContent">
            <div id="gameContainer">
                <ol id="guesses">
                </ol>
            </div>

            <div id="winContainer" class="hidden">
                <div id="winHeaderContainer">
                    <img class="winSticker" id="winStickerL" width="100">
                    <p id="winText"></p>
                    <img class="winSticker" id="winStickerR" width="100">
                </div>
                <img id="winSongImg" src="Images/loading_jacket.svg" width="250" height="250">

                <p id="winSongTitle"></p>

                <div id="dailyContainer">
                    <p>Daily song #<b id="dayLabel"></b></p>
                </div>

                <button id="newGame" class="blueButton" onclick="NewGame()">Play Again</button>
            </div>
        </div>

        <div class="layoutFlexItem" id="guessingInterface">
            <search id="searchContainer">
                <select id="choices"></select>
                <button id="guessButton" class="blueButton" onclick="Guess()">Guess</button>
            </search>
        </div>
    </div>
    <footer>
        <small>This is a non-commercial fan site, unaffiliated with Sega, Colorful Palette, or Crypton. Data
            from <a href="https://github.com/Sekai-World">Sekai-World</a> & <a
                href="https://pjsk.cleista.cc/">Cleista</a>.</small>
    </footer>

    <dialog id="jacketViewer">
        <div id="jacketViewerLayout">
            <img id="jacketViewerImg">
            <button class="blueButton" onclick="HideArtwork()">Hide</button>
        </div>
    </dialog>

    <!-- Game Scripts -->
    <script src="JavaScript/song.js"></script>
    <script src="JavaScript/songList.js"></script>
    <script src="JavaScript/randomSongIds.js"></script>
    <script src="JavaScript/script.js"></script>
    <script src="JavaScript/choices.js"></script>
</body>

</html>
